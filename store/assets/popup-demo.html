<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaDown - HLS/MP4 Video Downloader</title>
  <link rel="stylesheet" href="../../popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-glow"></div>
        <img src="../../icons/icon48.png" alt="Logo" class="logo-img">
        <div class="brand-text">
          <h1>MediaDown</h1>
          <p>HLS · MP4 Video Detector</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <!-- Section: Manual URL Input -->
      <section class="manual-input-box">
        <div class="input-wrapper">
          <input type="text" id="manual-url" data-i18n-placeholder="urlPlaceholder" autocomplete="off">
          <button id="btn-manual-download" data-i18n-title="detectUrl">
            <svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
          </button>
        </div>
      </section>

      <!-- Section: Active Stream list -->
      <section class="streams-section">
        <div class="section-header">
          <h2><span data-i18n="detectedStreams"></span> <span id="total-count" class="badge">0</span></h2>
          <div class="section-tools">
            <label class="raw-toggle" data-i18n-title="rawToggleTitle">
              <input type="checkbox" id="raw-toggle"> <span data-i18n="rawToggle"></span>
            </label>
            <button id="btn-clear" class="btn-text" data-i18n-title="clearListTitle" data-i18n="clearList"></button>
          </div>
        </div>
        
        <div id="streams-list" class="streams-list">
          <!-- Dynamically populated stream cards -->
          <div class="empty-state">
            <div class="pulse-ring"></div>
            <svg viewBox="0 0 24 24" class="empty-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
            <p data-i18n="waiting"></p>
            <span data-i18n="waitingHint"></span>
          </div>
        </div>
      </section>

      <!-- Section: Completed List -->
      <section class="completed-section" id="completed-section">
        <div class="divider-text"><span data-i18n="completed"></span></div>
        <div id="completed-list" class="completed-list">
          <!-- Dynamically populated completed items -->
          <div class="completed-empty" data-i18n="noCompleted"></div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-links">
        <button id="btn-hide-history" class="btn-text-link" data-i18n="hide"></button>
        <button id="btn-clear-history" class="btn-text-link" data-i18n="clearAll"></button>
      </div>
      <p>MediaDown v1.4 • Chrome MV3</p>
    </footer>
  </div>
  <script src="fake-chrome.js"></script>
  <script src="../../hls.min.js"></script>
  <script src="../../streams.js"></script>
  <script src="../../popup.js"></script>
</body>
</html>
