<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaDown - HLS/TS Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-glow"></div>
        <img src="icons/icon48.png" alt="Logo" class="logo-img">
        <div class="brand-text">
          <h1>MediaDown</h1>
          <p>HLS/TS Stream Detector</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <!-- Section: Manual URL Input -->
      <section class="manual-input-box">
        <div class="input-wrapper">
          <input type="text" id="manual-url" placeholder="m3u8 또는 ts 주소를 직접 입력..." autocomplete="off">
          <button id="btn-manual-download" title="주소 감지">
            <svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
          </button>
        </div>
      </section>

      <!-- Section: Active Stream list -->
      <section class="streams-section">
        <div class="section-header">
          <h2>감지된 미디어 스트림 <span id="total-count" class="badge">0</span></h2>
          <div class="section-tools">
            <label class="raw-toggle" title="같은 영상으로 묶지 않고 감지된 주소를 모두 표시">
              <input type="checkbox" id="raw-toggle"> 모든 주소
            </label>
            <button id="btn-clear" class="btn-text" title="감지 목록 비우기">감지 비우기</button>
          </div>
        </div>
        
        <div id="streams-list" class="streams-list">
          <!-- Dynamically populated stream cards -->
          <div class="empty-state">
            <div class="pulse-ring"></div>
            <svg viewBox="0 0 24 24" class="empty-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
            <p>스트림 감지 대기 중...</p>
            <span>영상을 재생하면 자동으로 분석을 진행합니다.</span>
          </div>
        </div>
      </section>

      <!-- Section: Completed List -->
      <section class="completed-section" id="completed-section">
        <div class="divider-text"><span>완료</span></div>
        <div id="completed-list" class="completed-list">
          <!-- Dynamically populated completed items -->
          <div class="completed-empty">완료된 다운로드가 없습니다.</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-links">
        <button id="btn-hide-history" class="btn-text-link">숨기기</button>
        <button id="btn-clear-history" class="btn-text-link">모두 비우기</button>
      </div>
      <p>MediaDown v1.2 • Chrome MV3</p>
    </footer>
  </div>
  <script src="hls.min.js"></script>
  <script src="streams.js"></script>
  <script src="popup.js"></script>
</body>
</html>
